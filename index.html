<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Renshuu 練習 - Neon Osaka</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="bg-particles"></div>

    <div class="dashboard-container">
        <header class="top-bar">
            <div class="user-profile">
                <div class="avatar-circle">
                    <span id="userInitial">W</span>
                </div>
                <span id="userName">Wibu Learner</span>
            </div>
            <div class="points-display">
                <span class="gem-icon">💎</span>
                <span id="userPoints">0</span>
            </div>
        </header>

        <div class="title-section">
            <h1 class="main-title">Renshuu<span class="kanji-title">練習</span></h1>
            <p class="subtitle">Pilih Mode Latihanmu</p>
        </div>

        <div class="menu-grid">
            
            <button class="diamond-btn neon-cyan" onclick="window.location.href='quiz.html?mode=kanji-arti'">
                <div class="diamond-content">
                    <span class="btn-icon">🔤</span>
                    <span class="btn-title">Kanji ➔ Arti</span>
                    <span class="btn-desc">Tebak Bahasa Indonesia</span>
                </div>
            </button>

            <button class="diamond-btn neon-pink" onclick="window.location.href='quiz.html?mode=kanji-hiragana'">
                <div class="diamond-content">
                    <span class="btn-icon">あ</span>
                    <span class="btn-title">Kanji ➔ Baca</span>
                    <span class="btn-desc">Tebak Hiragana</span>
                </div>
            </button>

            <button class="diamond-btn neon-purple" onclick="window.location.href='quiz.html?mode=hiragana-arti'">
                <div class="diamond-content">
                    <span class="btn-icon">📖</span>
                    <span class="btn-title">Baca ➔ Arti</span>
                    <span class="btn-desc">Dari Hiragana ke ID</span>
                </div>
            </button>

            <button class="diamond-btn neon-yellow" onclick="window.location.href='quiz.html?mode=flashcard'">
                <div class="diamond-content">
                    <span class="btn-icon">⚡</span>
                    <span class="btn-title">Flashcard</span>
                    <span class="btn-desc">Mode Acak Cepat</span>
                </div>
            </button>

        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="menu.js"></script>
</body>
</html>
